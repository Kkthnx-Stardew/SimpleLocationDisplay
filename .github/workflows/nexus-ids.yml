# One-off: prints the Nexus Mods IDs the upload action needs. Run it by hand from the
# Actions tab, copy the file ID into the NEXUS_FILE_ID variable, then delete this file.
# It only reads, and it prints the mod and its file list, never the API key.
name: Look up Nexus IDs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    env:
      NEXUS_KEY: ${{ secrets.NEXUS_API_PERSONAL_KEY }}
      GAME_DOMAIN: stardewvalley
      GAME_SCOPED_ID: ${{ vars.NEXUS_MOD_ID }}
    steps:
      - name: Look up the mod and its files
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.nexusmods.com/v3"
          curl_get() {
            curl -sS --fail-with-body -H "apikey: $NEXUS_KEY" -H "User-Agent: SimpleLocationDisplay-release" "$1"
          }

          echo "== Mod $GAME_DOMAIN/$GAME_SCOPED_ID"
          mod=$(curl_get "$base/games/$GAME_DOMAIN/mods/$GAME_SCOPED_ID")
          echo "$mod" | jq '.' | head -c 3500
          echo

          mod_id=$(echo "$mod" | jq -r '.data.id // .id // empty')
          if [ -z "$mod_id" ]; then
            echo "Could not find the mod's id in the response above." >&2
            exit 1
          fi
          echo "== Mod id: $mod_id"

          echo "== Files of the mod"
          curl_get "$base/mods/$mod_id/files" | jq '.' | head -c 6000
          echo
